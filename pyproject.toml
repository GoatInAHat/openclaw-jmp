[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-jmp-sms"
version = "1.0.0"
description = "Secure SMS channel skill for OpenClaw using JMP.chat XMPP bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "OpenClaw Contributors"}
]
keywords = [
    "openclaw",
    "sms",
    "jmp",
    "xmpp",
    "chatbot",
    "ai-assistant",
    "secure-messaging"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "slixmpp>=1.8.0",
    "pydantic>=2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/GoatInAHat/openclaw-jmp"
Documentation = "https://github.com/GoatInAHat/openclaw-jmp#readme"
Repository = "https://github.com/GoatInAHat/openclaw-jmp.git"
Issues = "https://github.com/GoatInAHat/openclaw-jmp/issues"

[project.scripts]
jmp-send = "scripts.send_sms:main"
jmp-daemon = "scripts.daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "agents*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
